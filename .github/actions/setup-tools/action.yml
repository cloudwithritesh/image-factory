name: Set up image factory tools
description: >-
  Installs the pinned Packer, Syft, Grype and crane releases from
  ci/versions.env (checksum-verified, cached), plus the Python tools from
  ci/requirements-core.txt. GitHub-hosted Ubuntu runners already include
  Docker, jq, shellcheck, and the AWS and Azure CLIs.

runs:
  using: composite
  steps:
    - name: Read pinned versions
      id: versions
      shell: bash
      run: |
        grep -E '^[A-Z_]+=' ci/versions.env >> "$GITHUB_OUTPUT"
        echo "bin=${RUNNER_TEMP}/factory-bin" >> "$GITHUB_OUTPUT"

    - name: Cache tool binaries
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.versions.outputs.bin }}
        key: factory-tools-${{ runner.os }}-${{ hashFiles('ci/versions.env') }}

    - name: Download tools (checksum verified)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BIN: ${{ steps.versions.outputs.bin }}
        PACKER_VERSION: ${{ steps.versions.outputs.PACKER_VERSION }}
        SYFT_VERSION: ${{ steps.versions.outputs.SYFT_VERSION }}
        GRYPE_VERSION: ${{ steps.versions.outputs.GRYPE_VERSION }}
        CRANE_VERSION: ${{ steps.versions.outputs.CRANE_VERSION }}
      run: |
        set -euo pipefail
        mkdir -p "$BIN"; cd "$(mktemp -d)"

        curl -fsSLO "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
        curl -fsSLO "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS"
        grep "packer_${PACKER_VERSION}_linux_amd64.zip" "packer_${PACKER_VERSION}_SHA256SUMS" | sha256sum -c -
        unzip -o -q "packer_${PACKER_VERSION}_linux_amd64.zip" -d "$BIN" packer

        for tool in "syft:${SYFT_VERSION}" "grype:${GRYPE_VERSION}"; do
          name="${tool%%:*}"; ver="${tool#*:}"
          base="https://github.com/anchore/${name}/releases/download/v${ver}"
          curl -fsSLO "${base}/${name}_${ver}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${name}_${ver}_checksums.txt"
          grep " ${name}_${ver}_linux_amd64.tar.gz\$" "${name}_${ver}_checksums.txt" | sha256sum -c -
          tar -xzf "${name}_${ver}_linux_amd64.tar.gz" -C "$BIN" "$name"
        done

        base="https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}"
        curl -fsSLO "${base}/go-containerregistry_Linux_x86_64.tar.gz"
        curl -fsSLO "${base}/checksums.txt"
        grep " go-containerregistry_Linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
        tar -xzf go-containerregistry_Linux_x86_64.tar.gz -C "$BIN" crane

    - name: Add tools to PATH
      shell: bash
      run: echo "${{ steps.versions.outputs.bin }}" >> "$GITHUB_PATH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: ci/requirements-core.txt

    - name: Install Python tools
      shell: bash
      run: pip install -r ci/requirements-core.txt

    - name: Show versions
      shell: bash
      run: |
        packer version && syft version | head -2 && grype version | head -2 && crane version
        ansible --version | head -1
