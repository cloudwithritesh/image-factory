# Enforces docs/standards.md on every pull request: branch name, PR title
# and commit subjects, plus validation of all image and VM requests.
# Make "pr-standards" a required check on main (the configure script does).
name: pr-standards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      - name: Branch, title and commits
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate \
            --jq '.[].commit.message | split("\n")[0]' \
            | python3 -c 'import json, sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))' \
            > "$RUNNER_TEMP/commits.json"
          python3 scripts/portal/standards.py check --branch "$BRANCH" --title "$TITLE" \
            --commits-file "$RUNNER_TEMP/commits.json"

      - name: Image and VM requests are valid
        run: python3 scripts/portal/validate_all.py
