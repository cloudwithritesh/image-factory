# =============================================================================
# VM provisioning: applies vms/<name>.yaml after its PR is merged.
#   state: present  -> terraform apply  (create or update)
#   state: absent   -> terraform destroy (decommission; the file stays as a record)
# One Terraform state per VM: vms/<name>.tfstate
#   azure: terraform/vm/azure, state in the factory's Azure storage account
#   aws:   terraform/vm/aws,   state in the factory's S3 bucket
# The PR approval is the gate, so this runs straight away on merge.
# Runs are serialised per VM (job-level concurrency below).
# =============================================================================
name: vm-provision

on:
  push:
    branches: [main]
    paths: ["vms/**"]
  workflow_dispatch:
    inputs:
      vm:
        description: "VM name to (re)apply, e.g. web-01"
        type: string
        required: true
      debug:
        description: "Verbose Terraform logs (TF_LOG=DEBUG). May include infrastructure details."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Azure platform settings (terraform/vm/azure)
  TF_VAR_subscription_id: ${{ vars.PKR_VAR_azure_subscription_id }}
  TF_VAR_resource_group_name: ${{ vars.VM_RESOURCE_GROUP }}
  TF_VAR_subnet_id: ${{ vars.VM_SUBNET_ID }}
  TF_VAR_gallery_resource_group: ${{ vars.PKR_VAR_azure_gallery_resource_group }}
  TF_VAR_gallery_name: ${{ vars.PKR_VAR_azure_gallery_name }}
  # AWS platform settings (terraform/vm/aws)
  TF_VAR_vpc_id: ${{ vars.VM_AWS_VPC_ID }}
  TF_VAR_private_subnet_ids: ${{ vars.VM_AWS_PRIVATE_SUBNET_IDS }}
  TF_VAR_public_subnet_ids: ${{ vars.VM_AWS_PUBLIC_SUBNET_IDS }}
  TF_VAR_instance_profile: ${{ vars.VM_AWS_INSTANCE_PROFILE }}
  TF_VAR_kms_key_id: ${{ vars.PKR_VAR_aws_kms_key_id }}
  TF_VAR_catalog_ssm_prefix: ${{ vars.CATALOG_SSM_PREFIX || '/image-factory' }}
  TF_IN_AUTOMATION: "true"
  # Logging: see docs/logging.md
  FACTORY_LOG_LEVEL: ${{ inputs.debug && 'debug' || vars.FACTORY_LOG_LEVEL || 'info' }}
  FACTORY_CORRELATION_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      vms: ${{ steps.find.outputs.vms }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed VM requests
        id: find
        env:
          INPUT_VM: ${{ inputs.vm }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$INPUT_VM" ]]; then
            names="$INPUT_VM"
          else
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then BEFORE="${GITHUB_SHA}~1"; fi
            names="$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'vms/*.yaml' \
              | xargs -r -n1 basename | sed 's/\.yaml$//')"
            deleted="$(git diff --name-only --diff-filter=D "$BEFORE" "$GITHUB_SHA" -- 'vms/*.yaml' || true)"
            if [[ -n "$deleted" ]]; then
              echo "::warning::Deleting a VM file doesn't remove the VM. Set 'state: absent' (portal: Decommission) instead: ${deleted}"
            fi
          fi
          json="$(printf '%s\n' "$names" | sed '/^$/d' | jq -R . | jq -sc .)"
          echo "vms=${json}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$json")" >> "$GITHUB_OUTPUT"
          echo "VMs to apply: ${json}"

  apply:
    name: ${{ matrix.vm }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        vm: ${{ fromJSON(needs.detect.outputs.vms) }}
    # Serialise per VM, never globally. If a newer run for the same VM
    # replaces a pending one, nothing is lost: it applies the newer file,
    # which already contains the earlier change. Different VMs never wait
    # on (or cancel) each other.
    concurrency:
      group: vm-provision-${{ matrix.vm }}
      cancel-in-progress: false
    defaults:
      run:
        # explicit bash = -eo pipefail, so "terraform ... | tee" keeps the exit code
        shell: bash
    env:
      LOG_DIR: ${{ github.workspace }}/build/logs/vm-${{ matrix.vm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Logging setup
        env:
          VM: ${{ matrix.vm }}
        run: |
          mkdir -p "$LOG_DIR"
          ref="$(git log -1 --format='%(trailers:key=Request-ref,valueonly,separator=%x20)' HEAD | tr -d '[:space:]')"
          echo "REQUEST_REF=${ref}" >> "$GITHUB_ENV"
          if [[ "$FACTORY_LOG_LEVEL" == "debug" ]]; then
            { echo "TF_LOG=DEBUG"; echo "TF_LOG_PATH=${LOG_DIR}/terraform-debug.log"; } >> "$GITHUB_ENV"
            echo "::warning::Debug logging is on: terraform-debug.log may contain infrastructure details."
          fi
          echo "Correlation: run ${FACTORY_CORRELATION_ID}, request ${ref:-n/a}, VM ${VM}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: pip install pyyaml==6.0.3 jsonschema==4.26.0

      - name: Render Terraform variables
        id: request
        env:
          VM: ${{ matrix.vm }}
        run: |
          cloud="$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["spec"]["cloud"])' "vms/${VM}.yaml")"
          [[ -d "terraform/vm/${cloud}" ]] || { echo "::error::cloud '${cloud}' has no provisioning module"; exit 1; }
          python3 scripts/portal/vm_tfvars.py "vms/${VM}.yaml" \
            --out "terraform/vm/${cloud}/request.auto.tfvars.json" | tee -a "$GITHUB_OUTPUT"
          echo "dir=terraform/vm/${cloud}" >> "$GITHUB_OUTPUT"

      - name: Read Terraform version
        id: tf
        run: grep '^TERRAFORM_VERSION=' "${GITHUB_WORKSPACE}/ci/versions.env" | cut -d= -f2 | sed 's/^/version=/' >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        if: steps.request.outputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PKR_VAR_azure_subscription_id }}

      - name: AWS credentials (OIDC)
        if: steps.request.outputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.VM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PKR_VAR_aws_region }}
          role-session-name: vm-provision-${{ github.run_id }}

      - name: Terraform init
        working-directory: ${{ steps.request.outputs.dir }}
        env:
          VM: ${{ matrix.vm }}
          CLOUD: ${{ steps.request.outputs.cloud }}
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_BUCKET: ${{ vars.TF_STATE_AWS_BUCKET }}
          AWS_STATE_REGION: ${{ vars.PKR_VAR_aws_region }}
        run: |
          if [[ "$CLOUD" == "aws" ]]; then
            backend=(-backend-config="bucket=${STATE_BUCKET}" -backend-config="key=vms/${VM}.tfstate"
                     -backend-config="region=${AWS_STATE_REGION}" -backend-config="use_lockfile=true"
                     -backend-config="encrypt=true")
          else
            backend=(-backend-config="resource_group_name=${STATE_RG}" -backend-config="storage_account_name=${STATE_SA}"
                     -backend-config="container_name=tfstate" -backend-config="key=vms/${VM}.tfstate"
                     -backend-config="use_azuread_auth=true")
          fi
          terraform init -input=false "${backend[@]}" 2>&1 | tee "${LOG_DIR}/terraform-init.log"

      - name: Terraform apply
        if: steps.request.outputs.state == 'present'
        working-directory: ${{ steps.request.outputs.dir }}
        run: terraform apply -input=false -auto-approve -no-color 2>&1 | tee "${LOG_DIR}/terraform-apply.log"

      - name: Terraform destroy (decommission)
        if: steps.request.outputs.state == 'absent'
        working-directory: ${{ steps.request.outputs.dir }}
        run: terraform destroy -input=false -auto-approve -no-color 2>&1 | tee "${LOG_DIR}/terraform-destroy.log"

      - name: Failure triage
        if: failure()
        env:
          VM: ${{ matrix.vm }}
        run: python3 "${GITHUB_WORKSPACE}/scripts/ci/triage.py" "$LOG_DIR"/terraform-*.log --title "VM ${VM} failed" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-vm-${{ matrix.vm }}
          path: build/logs/vm-${{ matrix.vm }}/
          if-no-files-found: ignore
          retention-days: ${{ inputs.debug && 7 || 90 }}

      - name: Summary
        if: always() && steps.request.outputs.dir != ''
        working-directory: ${{ steps.request.outputs.dir }}
        env:
          VM: ${{ matrix.vm }}
          STATE: ${{ steps.request.outputs.state }}
        run: |
          {
            echo "### VM \`${VM}\` (${STATE})"
            if [[ "$STATE" == "present" ]] && terraform output -json > /dev/null 2>&1; then
              echo
              echo "| Output | Value |"
              echo "|---|---|"
              terraform output -json | jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
