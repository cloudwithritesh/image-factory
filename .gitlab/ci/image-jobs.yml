# =============================================================================
# Job templates for the generated child pipeline (build/child-pipeline.yml).
# scripts/imagefactory.py writes one build, scan and promote job per request
# and target, each extending a template below.
#
# Cloud access uses GitLab OIDC ID tokens; no cloud keys are stored in GitLab.
# Platform settings (account IDs, networks, gallery names) are CI/CD
# variables, taken from the Terraform factory outputs. See README.md.
# =============================================================================

.base:
  image: $TOOLBOX_IMAGE
  variables:
    PACKER_PLUGIN_PATH: $CI_PROJECT_DIR/.packer.d/plugins
    GRYPE_DB_CACHE_DIR: $CI_PROJECT_DIR/.cache/grype
  cache:
    - key: packer-plugins-v1
      paths: [.packer.d/plugins]
      policy: pull
    - key: grype-db
      paths: [.cache/grype]

.aws-auth:
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com

.azure-auth:
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange

# ---- build ------------------------------------------------------------------
.build:
  extends: .base
  stage: build
  timeout: 2h
  interruptible: false # never leave half-built cloud resources behind
  script:
    - scripts/ci/packer-build.sh
  artifacts:
    when: always
    paths: ["build/$IMAGE_NAME/output/"]
    expire_in: 90 days
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

.build-aws:
  extends: [.build, .aws-auth]

.build-azure:
  extends: [.build, .azure-auth]

.build-docker:
  extends: .build
  services: ["docker:27-dind"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    # Packer bind-mounts its temp dir into the build container. With dind
    # the path must be inside the shared builds volume.
    PACKER_TMP_DIR: $CI_PROJECT_DIR/.packer-tmp

# ---- scan -------------------------------------------------------------------
.scan:
  extends: .base
  stage: scan
  script:
    - scripts/ci/scan.sh
  artifacts:
    when: always
    paths: ["build/$IMAGE_NAME/output/"]
    expire_in: 90 days

.scan-vm:
  extends: .scan

.scan-container:
  extends: .scan

# ---- promote ----------------------------------------------------------------
# Protect the images/* environments in GitLab (Settings > CI/CD > Protected
# environments) to require named approvers for promotion.
.promote:
  extends: .base
  stage: promote
  interruptible: false
  script:
    - scripts/ci/promote.sh
  artifacts:
    paths: ["build/$IMAGE_NAME/output/"]
    expire_in: 1 year
  resource_group: promote-$IMAGE_NAME-$TARGET

.promote-aws:
  extends: [.promote, .aws-auth]
  environment:
    name: images/aws
    action: start

.promote-azure:
  extends: [.promote, .azure-auth]
  environment:
    name: images/azure
    action: start

.promote-docker:
  extends: .promote
  environment:
    name: images/docker
    action: start
