# -----------------------------------------------------------------------------
# OS catalog: the base image for each OS on each target.
#
# The portals (GitHub Pages and Backstage) build their "operating system"
# list from this file, grouped by vendor. Packer receives the target block
# that matches the target being built.
#
# Fields
#   display_name   shown in the portal
#   vendor         portal grouping
#   family         linux | windows   -> Packer template packer/<family>/
#   pkg_family     debian | redhat | suse | windows -> package manager and
#                  paths used by Ansible and the bootstrap/cleanup scripts
#   release        latest | previous: the vendor's newest stable major
#                  release, or the one before it. The catalog offers both
#                  (N and N-1) so existing images keep building while teams
#                  move up. Every build starts from the newest patched base
#                  image of that release and applies all updates on top.
#   ansible_python interpreter on the target, when the default python3 is too
#                  old for the pinned ansible-core (optional)
#   notes          one line shown in the portal (optional)
#   targets        base image per target (aws | azure | docker)
#
# Check every base image resolves: scripts/bootstrap/check-base-images.sh
# Add an OS: add a key here, a hardening entry in hardening.yaml, and list
# it under the software items it may use in software.yaml.
# Check a new Azure base image with:
#   az vm image list --publisher <p> --offer <o> --sku <s> --all -o table
# -----------------------------------------------------------------------------

# ---- Canonical ----------------------------------------------------------------
ubuntu-2604:
  display_name: Ubuntu 26.04 LTS
  vendor: Canonical
  family: linux
  pkg_family: debian
  release: latest
  notes: >-
    Released April 2026. AMD64 images need x86-64-v3 CPUs (Haswell and
    newer), which every offered VM size has. The CIS role for 26.04 is 0.9.0
    (the first public release); exceptions are in docs/hardening-exceptions.md.
  targets:
    aws:
      source_ami_filter_name: "ubuntu/images/hvm-ssd-gp3/ubuntu-resolute-26.04-amd64-server-*"
      source_ami_owners: ["099720109477"] # Canonical
      ssh_username: ubuntu
    azure:
      image_publisher: Canonical
      image_offer: ubuntu-26_04-lts
      image_sku: server # Gen2
      hyper_v_generation: V2
    docker:
      base_image: "docker.io/library/ubuntu:26.04"

ubuntu-2404:
  display_name: Ubuntu 24.04 LTS
  vendor: Canonical
  family: linux
  pkg_family: debian
  release: previous
  targets:
    aws:
      source_ami_filter_name: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
      source_ami_owners: ["099720109477"] # Canonical
      ssh_username: ubuntu
    azure:
      image_publisher: Canonical
      image_offer: ubuntu-24_04-lts
      image_sku: server # Gen2
      hyper_v_generation: V2
    docker:
      # Point this at your registry mirror / Docker Hub pull-through cache
      # in production to avoid rate limits.
      base_image: "docker.io/library/ubuntu:24.04"

# ---- Red Hat --------------------------------------------------------------------
rhel-10:
  display_name: Red Hat Enterprise Linux 10
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  release: latest
  notes: >-
    Pay-as-you-go cloud images (RHEL subscription included in the VM price).
    The container target uses the freely redistributable UBI 10 base image.
  targets:
    aws:
      source_ami_filter_name: "RHEL-10.*_HVM-*-x86_64-*-Hourly2-GP3"
      source_ami_owners: ["309956199498"] # Red Hat
      ssh_username: ec2-user
    azure:
      image_publisher: RedHat
      image_offer: RHEL
      image_sku: 10-lvm-gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.access.redhat.com/ubi10/ubi:latest"

rhel-9:
  display_name: Red Hat Enterprise Linux 9
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  release: previous
  notes: >-
    Pay-as-you-go cloud images (RHEL subscription included in the VM price).
    The container target uses the freely redistributable UBI 9 base image.
  targets:
    aws:
      source_ami_filter_name: "RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3"
      source_ami_owners: ["309956199498"] # Red Hat
      ssh_username: ec2-user
    azure:
      image_publisher: RedHat
      image_offer: RHEL
      image_sku: 9-lvm-gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.access.redhat.com/ubi9/ubi:latest"

ubi10-openshift:
  display_name: Red Hat UBI 10 for OpenShift (container)
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  release: latest
  notes: >-
    Container base image that follows the OpenShift image guidelines: runs as
    a non-root user (UID 1001) and works with OpenShift's random UIDs
    (group 0 owns the app folders).
  targets:
    docker:
      base_image: "registry.access.redhat.com/ubi10/ubi:latest"
      user: "1001"
      workdir: /opt/app-root/src

ubi9-openshift:
  display_name: Red Hat UBI 9 for OpenShift (container)
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  release: previous
  notes: >-
    Container base image that follows the OpenShift image guidelines: runs as
    a non-root user (UID 1001) and works with OpenShift's random UIDs
    (group 0 owns the app folders). OpenShift nodes (RHCOS) are managed by
    the cluster and aren't built here.
  targets:
    docker:
      base_image: "registry.access.redhat.com/ubi9/ubi:latest"
      user: "1001"
      workdir: /opt/app-root/src

# ---- Rocky Enterprise Software Foundation --------------------------------------------
rocky-10:
  display_name: Rocky Linux 10
  vendor: Rocky Linux
  family: linux
  pkg_family: redhat
  release: latest
  notes: >-
    Free RHEL 10-compatible rebuild. Azure isn't offered because the Rocky
    marketplace image needs a plan agreement per subscription.
  targets:
    aws:
      source_ami_filter_name: "Rocky-10-EC2-Base-10.*.x86_64"
      source_ami_owners: ["792107900819"] # Rocky Enterprise Software Foundation
      ssh_username: rocky
    docker:
      base_image: "docker.io/rockylinux/rockylinux:10"

rocky-9:
  display_name: Rocky Linux 9
  vendor: Rocky Linux
  family: linux
  pkg_family: redhat
  release: previous
  notes: >-
    Free RHEL-compatible rebuild. Azure isn't offered because the Rocky
    marketplace image needs a plan agreement per subscription.
  targets:
    aws:
      source_ami_filter_name: "Rocky-9-EC2-Base-9.*.x86_64"
