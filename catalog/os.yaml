# -----------------------------------------------------------------------------
# OS catalog: the base image for each OS on each target.
#
# The portals (GitHub Pages and Backstage) build their "operating system"
# list from this file, grouped by vendor. Packer receives the target block
# that matches the target being built.
#
# Fields
#   display_name   shown in the portal
#   vendor         portal grouping
#   family         linux | windows   -> Packer template packer/<family>/
#   pkg_family     debian | redhat | suse | windows -> package manager and
#                  paths used by Ansible and the bootstrap/cleanup scripts
#   status         ga | preview  (preview = builds, but not yet proven in
#                  production; the portal shows a badge)
#   ansible_python interpreter on the target, when the default python3 is too
#                  old for the pinned ansible-core (optional)
#   notes          one line shown in the portal (optional)
#   targets        base image per target (aws | azure | docker)
#
# Add an OS: add a key here, a hardening entry in hardening.yaml, and list
# it under the software items it may use in software.yaml.
# Check a new Azure base image with:
#   az vm image list --publisher <p> --offer <o> --sku <s> --all -o table
# -----------------------------------------------------------------------------

# ---- Canonical ----------------------------------------------------------------
ubuntu-2404:
  display_name: Ubuntu 24.04 LTS
  vendor: Canonical
  family: linux
  pkg_family: debian
  status: ga
  targets:
    aws:
      source_ami_filter_name: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
      source_ami_owners: ["099720109477"] # Canonical
      ssh_username: ubuntu
    azure:
      image_publisher: Canonical
      image_offer: ubuntu-24_04-lts
      image_sku: server # Gen2
      hyper_v_generation: V2
    docker:
      # Point this at your registry mirror / Docker Hub pull-through cache
      # in production to avoid rate limits.
      base_image: "docker.io/library/ubuntu:24.04"

# ---- Red Hat --------------------------------------------------------------------
rhel-9:
  display_name: Red Hat Enterprise Linux 9
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  status: preview
  notes: >-
    Pay-as-you-go cloud images (RHEL subscription included in the VM price).
    The container target uses the freely redistributable UBI 9 base image.
  targets:
    aws:
      source_ami_filter_name: "RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP3"
      source_ami_owners: ["309956199498"] # Red Hat
      ssh_username: ec2-user
    azure:
      image_publisher: RedHat
      image_offer: RHEL
      image_sku: 9-lvm-gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.access.redhat.com/ubi9/ubi:latest"

ubi9-openshift:
  display_name: Red Hat UBI 9 for OpenShift (container)
  vendor: Red Hat
  family: linux
  pkg_family: redhat
  status: preview
  notes: >-
    Container base image that follows the OpenShift image guidelines: runs as
    a non-root user (UID 1001) and works with OpenShift's random UIDs
    (group 0 owns the app folders). OpenShift nodes (RHCOS) are managed by
    the cluster and aren't built here.
  targets:
    docker:
      base_image: "registry.access.redhat.com/ubi9/ubi:latest"
      user: "1001"
      workdir: /opt/app-root/src

# ---- Rocky Enterprise Software Foundation --------------------------------------------
rocky-9:
  display_name: Rocky Linux 9
  vendor: Rocky Linux
  family: linux
  pkg_family: redhat
  status: preview
  notes: >-
    Free RHEL-compatible rebuild. Azure isn't offered because the Rocky
    marketplace image needs a plan agreement per subscription.
  targets:
    aws:
      source_ami_filter_name: "Rocky-9-EC2-Base-9.*.x86_64"
      source_ami_owners: ["792107900819"] # Rocky Enterprise Software Foundation
      ssh_username: rocky
    docker:
      base_image: "docker.io/rockylinux/rockylinux:9"

# ---- Amazon -----------------------------------------------------------------------------
amazonlinux-2023:
  display_name: Amazon Linux 2023
  vendor: Amazon
  family: linux
  pkg_family: redhat
  status: preview
  targets:
    aws:
      source_ami_filter_name: "al2023-ami-2023.*-kernel-*-x86_64"
      source_ami_owners: ["137112412989"] # Amazon
      ssh_username: ec2-user
    docker:
      base_image: "public.ecr.aws/amazonlinux/amazonlinux:2023"

# ---- Fedora Project ------------------------------------------------------------------
fedora-44:
  display_name: Fedora 44
  vendor: Fedora Project
  family: linux
  pkg_family: redhat
  status: preview
  notes: >-
    Fast-moving community release (about 13 months of updates). Good for
    developer and CI images; prefer RHEL or Rocky for long-lived servers.
    No official Azure image exists.
  targets:
    aws:
      source_ami_filter_name: "Fedora-Cloud-Base-AmazonEC2.x86_64-44-*"
      source_ami_owners: ["125523088429"] # Fedora Project
      ssh_username: fedora
    docker:
      base_image: "registry.fedoraproject.org/fedora:44"

# ---- SUSE ---------------------------------------------------------------------------
sles-15:
  display_name: SUSE Linux Enterprise Server 15 SP7
  vendor: SUSE
  family: linux
  pkg_family: suse
  status: preview
  # The system python3 is 3.6, too old for the pinned ansible-core.
  ansible_python: /usr/bin/python3.11
  notes: >-
    Pay-as-you-go cloud images. The container target uses the freely
    redistributable SLE BCI base image.
  targets:
    aws:
      source_ami_filter_name: "suse-sles-15-sp7-v*-hvm-ssd-x86_64"
      source_ami_owners: ["013907871322"] # SUSE
      ssh_username: ec2-user
    azure:
      image_publisher: SUSE
      image_offer: sles-15-sp7
      image_sku: gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.suse.com/bci/bci-base:15.7"

# ---- Microsoft ----------------------------------------------------------------------
windows-2022:
  display_name: Windows Server 2022 Datacenter
  vendor: Microsoft
  family: windows
  pkg_family: windows
  status: preview
  notes: >-
    Built over WinRM with Ansible and sysprep. Builds take 60-120 minutes
    because of Windows Update. Self-service VMs from Windows images aren't
    available yet (Linux only for now).
  targets:
    aws:
      source_ami_filter_name: "Windows_Server-2022-English-Full-Base-*"
      source_ami_owners: ["801119661308"] # Amazon (Windows AMIs)
    azure:
      image_publisher: MicrosoftWindowsServer
      image_offer: WindowsServer
      image_sku: 2022-datacenter-azure-edition
      hyper_v_generation: V2
