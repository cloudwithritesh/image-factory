  targets:
    aws:
      source_ami_filter_name: "al2023-ami-2023.*-kernel-*-x86_64"
      source_ami_owners: ["137112412989"] # Amazon
      ssh_username: ec2-user
    docker:
      base_image: "public.ecr.aws/amazonlinux/amazonlinux:2023"

# ---- Fedora Project ------------------------------------------------------------------
fedora-45:
  display_name: Fedora 45
  vendor: Fedora Project
  family: linux
  pkg_family: redhat
  release: latest
  notes: >-
    Released 3 November 2026, supported until about December 2027. Good for
    developer and CI images; prefer RHEL or Rocky for long-lived servers.
    No official Azure image exists.
  targets:
    aws:
      source_ami_filter_name: "Fedora-Cloud-Base-AmazonEC2.x86_64-45-*"
      source_ami_owners: ["125523088429"] # Fedora Project
      ssh_username: fedora
    docker:
      base_image: "registry.fedoraproject.org/fedora:45"

fedora-44:
  display_name: Fedora 44
  vendor: Fedora Project
  family: linux
  pkg_family: redhat
  release: previous
  notes: >-
    Fast-moving community release (about 13 months of updates). Good for
    developer and CI images; prefer RHEL or Rocky for long-lived servers.
    No official Azure image exists.
  targets:
    aws:
      source_ami_filter_name: "Fedora-Cloud-Base-AmazonEC2.x86_64-44-*"
      source_ami_owners: ["125523088429"] # Fedora Project
      ssh_username: fedora
    docker:
      base_image: "registry.fedoraproject.org/fedora:44"

# ---- SUSE ---------------------------------------------------------------------------
sles-16:
  display_name: SUSE Linux Enterprise Server 16.0
  vendor: SUSE
  family: linux
  pkg_family: suse
  release: latest
  notes: >-
    Pay-as-you-go cloud images (the "+Patching" offer on Azure). SELinux is
    on by default and /tmp is a tmpfs. The container target uses the SLE BCI
    16 base image.
  targets:
    aws:
      source_ami_filter_name: "suse-sles-16-0-v????????-hvm-ssd-x86_64" # skips -ecs/-byos/app variants
      source_ami_owners: ["013907871322"] # SUSE
      ssh_username: ec2-user
    azure:
      image_publisher: SUSE
      image_offer: sles-16-0-basic-x86-64
      image_sku: gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.suse.com/bci/bci-base:16.0"

sles-15:
  display_name: SUSE Linux Enterprise Server 15 SP7
  vendor: SUSE
  family: linux
  pkg_family: suse
  release: previous
  # The system python3 is 3.6, too old for the pinned ansible-core.
  ansible_python: /usr/bin/python3.11
  notes: >-
    Pay-as-you-go cloud images. The container target uses the freely
    redistributable SLE BCI base image.
  targets:
    aws:
      source_ami_filter_name: "suse-sles-15-sp7-v????????-hvm-ssd-x86_64" # ? = one character: skips -ecs/-byos variants
      source_ami_owners: ["013907871322"] # SUSE
      ssh_username: ec2-user
    azure:
      image_publisher: SUSE
      image_offer: sles-15-sp7
      image_sku: gen2
      hyper_v_generation: V2
    docker:
      base_image: "registry.suse.com/bci/bci-base:15.7"

# ---- Microsoft ----------------------------------------------------------------------
windows-2025:
  display_name: Windows Server 2025 Datacenter
  vendor: Microsoft
  family: windows
  pkg_family: windows
  release: latest
  notes: >-
    Built over WinRM with Ansible and sysprep. Builds take 60-120 minutes
    because of Windows Update. Self-service VMs from Windows images aren't
    available yet (Linux only for now).
  targets:
    aws:
      source_ami_filter_name: "Windows_Server-2025-English-Full-Base-*"
      source_ami_owners: ["801119661308"] # Amazon (Windows AMIs)
    azure:
      image_publisher: MicrosoftWindowsServer
      image_offer: WindowsServer
      image_sku: 2025-datacenter-azure-edition
      hyper_v_generation: V2

