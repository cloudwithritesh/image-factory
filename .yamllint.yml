extends: default
ignore: |
  build/
  ansible/.galaxy/
  .packer.d/
rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
