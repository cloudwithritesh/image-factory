# GENERATED by scripts/portal/render.py from catalog/*.yaml and requests/.
# Don't edit; change the catalogs and run: python3 scripts/portal/render.py backstage
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vm-request
  title: Create, change or decommission a VM
  description: Get a VM built from an approved golden image. Creates a pull request; the VM is provisioned when it's approved
    and merged.
  tags:
    - image-factory
    - vm
    - self-service
spec:
  owner: group:default/platform-engineering
  type: vm
  parameters:
    - title: VM
      required:
        - name
        - owner
        - environment
        - state
      properties:
        state:
          title: Action
          type: string
          enum:
            - present
            - absent
          enumNames:
            - Create or update
            - Decommission
          default: present
        name:
          title: VM name
          type: string
          pattern: ^[a-z][a-z0-9-]{1,13}[a-z0-9]$
          ui:help: '3-15 characters. Existing VMs: none yet'
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
            allowArbitraryValues: true
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - test
            - prod
        description:
          title: Purpose
          type: string
          maxLength: 250
    - title: Image and size
      properties:
        cloud:
          title: Cloud
          type: string
          enum:
            - azure
          default: azure
        image:
          title: Golden image
          type: string
          enum:
            - ubuntu-2404-base
            - ubuntu-demo
            - ubuntu-rh-hardened
        image_version:
          title: Image version
          type: string
          default: latest
          ui:help: latest = newest promoted version
        size:
          title: Size
          type: string
          enum:
            - small
            - medium
            - large
          enumNames:
            - small (Standard_B2s)
            - medium (Standard_D2s_v5)
            - large (Standard_D4s_v5)
          default: small
        region:
          title: Region
          type: string
          enum:
            - southeastasia
          default: southeastasia
        os_disk_gb:
          title: OS disk (GB)
          type: integer
          minimum: 30
          maximum: 512
          default: 30
    - title: Access
      properties:
        admin_username:
          title: Admin user
          type: string
          default: azureuser
        ssh_public_key:
          title: SSH public key
          type: string
          ui:widget: textarea
          ui:help: Paste the whole line from ~/.ssh/id_ed25519.pub
        public_ip:
          title: Public IP
          type: boolean
          default: false
        allowed_ssh_cidr:
          title: Allowed SSH range (with public IP)
          type: string
          ui:help: Your office or VPN range, e.g. 203.0.113.0/24
  steps:
    - id: request
      name: Open a pull request
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=cloudwithritesh&repo=image-factory
        workflowId: portal-request.yml
        branchOrTagName: main
        workflowInputs:
          kind: vm
          payload: ${{ parameters | dump }}
          requested_by: ${{ user.entity.metadata.name if user.entity else 'guest' }}
          source: backstage
  output:
    links:
      - title: Your request's pull request
        icon: github
        url: https://github.com/cloudwithritesh/image-factory/pulls?q=is%3Apr+label%3Avm-request+sort%3Acreated-desc
      - title: Request processing runs
        icon: dashboard
        url: https://github.com/cloudwithritesh/image-factory/actions/workflows/portal-request.yml
