# GENERATED by scripts/portal/render.py from catalog/*.yaml and requests/.
# Don't edit; change the catalogs and run: python3 scripts/portal/render.py backstage
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-image-request
  title: Request or change a golden image
  description: Ask the image factory for a new golden image, or change an existing one (use its name). Creates a pull request
    for review.
  tags:
    - image-factory
    - golden-image
    - packer
  annotations:
    backstage.io/source-location: url:https://github.com/cloudwithritesh/image-factory/tree/main/
spec:
  owner: group:default/platform-engineering
  type: golden-image
  parameters:
    - title: Image
      required:
        - name
        - owner
        - os
        - targets
      properties:
        name:
          title: Image name
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$
          ui:help: 'Lowercase, digits and hyphens. Existing images: ubuntu-2404-base, ubuntu-rh-hardened. Use an existing
            name to change that image.'
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
            allowArbitraryValues: true
        description:
          title: Description
          type: string
          maxLength: 250
        os:
          title: Operating system
          type: string
          enum:
            - amazonlinux-2023
            - fedora-44
            - fedora-45
            - rhel-10
            - rhel-9
            - rocky-10
            - rocky-9
            - sles-15
            - sles-16
            - ubi10-openshift
            - ubi9-openshift
            - ubuntu-2404
            - ubuntu-2604
            - windows-2022
            - windows-2025
          enumNames:
            - 'Amazon: Amazon Linux 2023 (latest)'
            - 'Fedora Project: Fedora 44'
            - 'Fedora Project: Fedora 45 (latest)'
            - 'Red Hat: Red Hat Enterprise Linux 10 (latest)'
            - 'Red Hat: Red Hat Enterprise Linux 9'
            - 'Rocky Linux: Rocky Linux 10 (latest)'
            - 'Rocky Linux: Rocky Linux 9'
            - 'SUSE: SUSE Linux Enterprise Server 15 SP7'
            - 'SUSE: SUSE Linux Enterprise Server 16.0 (latest)'
            - 'Red Hat: Red Hat UBI 10 for OpenShift (container) (latest)'
            - 'Red Hat: Red Hat UBI 9 for OpenShift (container)'
            - 'Canonical: Ubuntu 24.04 LTS'
            - 'Canonical: Ubuntu 26.04 LTS (latest)'
            - 'Microsoft: Windows Server 2022 Datacenter'
            - 'Microsoft: Windows Server 2025 Datacenter (latest)'
        targets:
          title: Targets
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum:
              - azure
              - docker
          ui:widget: checkboxes
    - title: Hardening and software
      properties:
        hardening_vm:
          title: VM hardening profile
          type: string
          enum:
            - baseline
            - cis-l1
            - cis-l2
            - none
          ui:help: Leave empty for the OS default (CIS Level 1).
        hardening_container:
          title: Container hardening profile
          type: string
          enum:
            - baseline-container
            - cis-l1-container
            - none
            - openshift
        software:
          title: Approved software
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - 7zip
              - ca-certificates
              - corp-root-ca
              - curl
              - jq
              - monitoring-basics
              - node-exporter
              - powershell-7
              - sysinternals
              - unzip
            enumNames:
              - '7zip: 7-Zip file archiver'
              - 'ca-certificates: Mozilla CA bundle'
              - 'corp-root-ca: Corporate root CA certificate, added to the system trust store'
              - 'curl: curl CLI'
              - 'jq: jq JSON processor'
              - 'monitoring-basics: sysstat and iotop (plus htop where the base repos ship it) for troubleshooting'
              - 'node-exporter: Prometheus node_exporter binary (not enabled as a service)'
              - 'powershell-7: PowerShell 7 (pwsh)'
              - 'sysinternals: Sysinternals Suite troubleshooting tools'
              - 'unzip: unzip'
          ui:widget: checkboxes
    - title: Release
      properties:
        promotion:
          title: Promotion
          type: string
          enum:
            - auto
            - manual
          enumNames:
            - Automatic after the scan passes
            - Manual approval
          default: auto
        fail_on_severity:
          title: Block images with vulnerabilities at or above
          type: string
          enum:
            - negligible
            - low
            - medium
            - high
            - critical
          default: critical
  steps:
    - id: request
      name: Open a pull request
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=cloudwithritesh&repo=image-factory
        workflowId: portal-request.yml
        branchOrTagName: main
        workflowInputs:
          kind: image
          payload: ${{ parameters | dump }}
          requested_by: ${{ user.entity.metadata.name if user.entity else 'guest' }}
          source: backstage
  output:
    links:
      - title: Your request's pull request
        icon: github
        url: https://github.com/cloudwithritesh/image-factory/pulls?q=is%3Apr+label%3Aimage-request+sort%3Acreated-desc
      - title: Request processing runs
        icon: dashboard
        url: https://github.com/cloudwithritesh/image-factory/actions/workflows/portal-request.yml
