# Third-party roles, pinned to a release tag. Packer installs them into
# ansible/.galaxy/roles before each build (galaxy_file in build.pkr.hcl).
# Collections come from the pinned `ansible` package in the CI toolbox image.
#
# Upgrading a hardening role is a reviewed change: bump the version, read
# the role's Changelog.md, adjust ansible/vars/hardening/ and rebuild.
roles:
  - name: ubuntu24_cis
    src: https://github.com/ansible-lockdown/UBUNTU24-CIS.git
    scm: git
    version: "1.8.0" # CIS Ubuntu 24.04 LTS Benchmark v1.0.0

  - name: rhel9_cis
    src: https://github.com/ansible-lockdown/RHEL9-CIS.git
    scm: git
    version: "2.4.2" # CIS RHEL 9 Benchmark v2.0.0 (RHEL, Rocky, Alma)

  - name: amazon2023_cis
    src: https://github.com/ansible-lockdown/AMAZON2023-CIS.git
    scm: git
    version: "1.5.0" # CIS Amazon Linux 2023 Benchmark

  - name: windows2022_cis
    src: https://github.com/ansible-lockdown/Windows-2022-CIS.git
    scm: git
    version: "4.2.0" # CIS Microsoft Windows Server 2022 Benchmark
