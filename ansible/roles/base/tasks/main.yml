---
# Bring the base image fully up to date. This patch level is what the
# vulnerability scan judges, so scheduled rebuilds pick up new fixes.
# pkg_family (debian | redhat | suse) comes from catalog/os.yaml.
- name: Check the package family
  ansible.builtin.assert:
    that: pkg_family in ['debian', 'redhat', 'suse']
    fail_msg: "pkg_family '{{ pkg_family | default('unset') }}' isn't a Linux family (see catalog/os.yaml)"

- name: Patch ({{ pkg_family }})
  ansible.builtin.include_tasks: "{{ pkg_family }}.yml"

# Reboot VMs whenever updates were applied, so later steps (hardening,
# SBOM) see the running kernel and libraries that will ship.
- name: Reboot into the updated system (VMs)
  when: image_kind == 'vm' and base_updates_applied | default(false)
  ansible.builtin.reboot:
    reboot_timeout: 900
